name: Publicar no PyPI 🚀

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*' # Disparará quando você enviar uma tag como v1.0.0, v1.1.0, etc.

jobs:
  build-n-publish:
    name: Build & Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write    # REQUISITO CRÍTICO: Necessário para autenticação OIDC do Trusted Publisher
      contents: read     # Necessário para fazer o checkout do repositório

    steps:
    - name: Checkout do código 📁
      uses: actions/checkout@v4

    - name: Configurar Python 🐍
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Instalar dependências de Build 📦
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Compilar pacote (Source Dist e Wheel) 🏗️
      run: python -m build

    - name: Verificar integridade do pacote 🔍
      run: python -m twine check dist/*

    - name: Publicar no PyPI via Trusted Publisher 🚀
      uses: pypa/github-action-pypi-publish@release/v1
      with:
        packages-dir: dist/

