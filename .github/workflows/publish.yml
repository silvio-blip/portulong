name: Publicar Automaticamente no PyPI

on:
  push:
    branches:
      - main
      - master
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publicar:
    name: Compilar e Enviar para PyPI
    runs-on: ubuntu-latest
    steps:
      - name: Clonar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar ferramentas de empacotamento
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Gerar pacotes de distribuição (.whl e .tar.gz)
        run: python -m build

      - name: Validar integridade dos pacotes
        run: twine check dist/*

      - name: Publicar no PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload --skip-existing dist/*
