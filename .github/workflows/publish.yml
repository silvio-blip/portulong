name: Publicar no PyPI

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Compilar e Enviar para o PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Descarregar código (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências de compilação
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Gerar pacotes de distribuição (.tar.gz e .whl)
        run: python -m build

      - name: Verificar integridade dos pacotes
        run: twine check dist/*

      - name: Enviar para o PyPI via Token
        if: ${{ secrets.PYPI_API_TOKEN != '' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --skip-existing dist/*

      - name: Enviar para o PyPI via Trusted Publishing (OIDC)
        if: ${{ secrets.PYPI_API_TOKEN == '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          print-hash: true
